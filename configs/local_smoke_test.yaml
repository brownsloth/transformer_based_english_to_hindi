# Fast local verification (~5–15 min on CPU, faster on GPU)
# Use: python scripts/train.py --config configs/local_smoke_test.yaml

seed: 42

model:
  d_model: 256
  num_layers: 2
  num_heads: 4
  d_ff: 1024
  dropout: 0.1
  seq_len: 128

data:
  dataset_name: Helsinki-NLP/opus-100
  lang_src: en
  lang_tgt: hi
  train_split_ratio: 0.9
  batch_size: 2
  num_workers: 0
  max_train_samples: 200
  truncate_long: true

training:
  num_epochs: 1
  lr: 0.0001
  label_smoothing: 0.1
  amp: false
  grad_clip: 1.0
  val_every_n_steps: 10
  val_num_examples: 1
  save_every_n_epochs: 1
  preload: null

paths:
  output_dir: outputs/local_smoke
  model_basename: smoke_
  tokenizer_pattern: tokenizers/tokenizer_{lang}.json

tensorboard:
  enabled: true
  log_dir: runs
  flush_secs: 10
  log_hparams: true

monitoring:
  status_file: status.json
  heartbeat_every_n_steps: 5
  log_file: train.log
  webhook_url: null
  alert_on_epoch_end: false
  alert_on_start: false
  alert_on_finish: false
