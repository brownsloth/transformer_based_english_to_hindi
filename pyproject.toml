[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-lib"
version = "0.1.0"
description = "Transformer from scratch: translation, classification, training toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0",
  "datasets>=2.14.0",
  "tokenizers>=0.15.0",
  "tqdm>=4.65.0",
  "PyYAML>=6.0",
  "tensorboard>=2.14.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
bleu = ["sacrebleu>=2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
